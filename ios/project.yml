# XcodeGen spec — generates TappyAI.xcodeproj.
# Run: xcodegen generate
name: TappyAI
options:
  bundleIdPrefix: com.tappyai
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"          # PROVISIONAL scaffold value — final min-iOS decided during Phase 0 (ADR-003). Not a lock.
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"                       # CI round 1: Swift 5 mode to get a green build first; revisit Swift 6 later
    SWIFT_STRICT_CONCURRENCY: minimal          # CI round 1: tighten back to complete when syncing Phase 7/8
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO         # keep clean; flip to YES once verified on a Mac
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""                        # set locally
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"                # iPhone only: iPad has never been tested. An iPad
                                               # build would be reviewed on iPad (App Store 2.4.1).

configs:
  Debug: debug
  Release: release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  Firebase:
    # Cloud Messaging only (push, provider "fcm" — same as Android). No Analytics: iOS does not
    # collect it, and the privacy manifest / App Privacy answers assume that.
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  TappyAI:
    type: application
    platform: iOS
    sources:
      - path: TappyAI
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Firebase
        product: FirebaseMessaging
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: TappyAI
        INFOPLIST_FILE: TappyAI/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"             # iPhone only; must be set HERE: XcodeGen's iOS preset writes "1,2" at target level and overrides the project-level value
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        CODE_SIGN_ENTITLEMENTS: TappyAI/TappyAI.entitlements
    scheme:
      testTargets:
        - TappyAITests
        - TappyAIUITests
      gatherCoverageData: true

  TappyAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TappyAITests
    dependencies:
      - target: TappyAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tappyai.ios.tests

  TappyAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TappyAIUITests
    dependencies:
      - target: TappyAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tappyai.ios.uitests
