# Builds the SuperTux WebAssembly bundle that /games/supertux serves.
#
# Why this exists: the artifact we currently ship is SuperTux 0.6.3's official web build, which is an
# Emscripten *pthreads* build. It allocates `new WebAssembly.Memory({shared: true})`, so it needs
# SharedArrayBuffer, which needs cross-origin isolation — and the Android WebView never grants that
# (verified on WebView 124 and 150; Chrome 150 on the same device runs it fine). Upstream dropped
# pthreads from the Emscripten configuration, so a build from 0.7.0 onwards runs without
# SharedArrayBuffer and therefore inline in the app's WebView. Upstream publishes no web build for
# tagged releases, so we produce our own from a pinned tag rather than depending on their nightly —
# which is not only unreleased code but is currently broken (it aborts at startup with
# "missing function: IMG_Load_IO", in desktop Chrome as well as in a WebView).
#
# This is a pipeline, not a one-off: bump `supertux_ref` to build 0.7.1, 0.8.0, ... unchanged.
#
# Output: an artifact containing supertux2.{html,js,wasm,data} plus build-manifest.txt (exact source
# SHA, emcc version, sizes, SHA-256). Publishing those files to Blob/public is a separate, deliberate
# step — this workflow never deploys.
name: SuperTux WASM

on:
  workflow_dispatch:
    inputs:
      supertux_ref:
        description: "SuperTux git ref to build (tag, branch or SHA)"
        required: true
        default: "v0.7.0"
      emsdk_version:
        description: 'Emscripten SDK version — "latest", or pin (e.g. 3.1.64) to reproduce an earlier build'
        required: true
        default: "latest"
      build_type:
        description: "CMake build type"
        required: true
        default: "Release"
        type: choice
        options: [Release, Debug]
  # Lets the pipeline be exercised from a scratch branch before it lives on the default branch —
  # `workflow_dispatch` only offers a Run button for workflows already on the default branch.
  push:
    branches: ["ci/supertux-wasm**"]

permissions:
  contents: read

concurrency:
  group: supertux-wasm-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPERTUX_REF: ${{ github.event.inputs.supertux_ref || 'v0.7.0' }}
  EMSDK_VERSION: ${{ github.event.inputs.emsdk_version || 'latest' }}
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # vcpkg compiles SDL2/libvorbis/freetype from source on a cold cache.
    timeout-minutes: 180

    steps:
      - name: Check out SuperTux
        uses: actions/checkout@v4
        with:
          repository: SuperTux/supertux
          ref: ${{ env.SUPERTUX_REF }}
          submodules: recursive
          # Upstream's CMake runs `git describe` for the version string, so shallow won't do.
          fetch-depth: 0
          path: supertux

      - name: Record source revision
        id: src
        working-directory: supertux
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Guard - source must not configure pthreads
        working-directory: supertux
        run: |
          if grep -REn -- '-pthread|USE_PTHREADS|PTHREAD_POOL_SIZE' mk CMakeLists.txt 2>/dev/null; then
            echo "::error::This ref enables Emscripten pthreads. The result would require SharedArrayBuffer and could not run in the Android WebView."
            exit 1
          fi
          echo "OK: no pthreads flags in the Emscripten configuration."

      - name: Install Emscripten toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake build-essential curl zip rsync
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk
          ./emsdk install "${EMSDK_VERSION}"
          ./emsdk activate "${EMSDK_VERSION}"
          # vcpkg is preinstalled on GitHub-hosted runners ($VCPKG_INSTALLATION_ROOT).
          vcpkg integrate install

      - name: Resolve toolchain version
        id: em
        run: |
          source ~/emsdk/emsdk_env.sh
          echo "emcc=$(emcc --version | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: supertux/vcpkg_installed
          key: stwasm-${{ runner.os }}-${{ env.SUPERTUX_REF }}-${{ env.EMSDK_VERSION }}-${{ env.BUILD_TYPE }}

      - name: Configure
        working-directory: supertux
        run: |
          source ~/emsdk/emsdk_env.sh
          mkdir -p build && cd build
          emcmake cmake .. -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" -DWARNINGS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=~/emsdk/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
            -DVCPKG_TARGET_TRIPLET=wasm32-emscripten -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DVCPKG_MANIFEST_FEATURES=core

      # The game data is packaged into supertux2.data by --preload-file, and upstream's CMake
      # preloads the *build* tree's data/ directory — so it has to be populated first.
      - name: Stage game data
        working-directory: supertux/build
        run: rsync -a ../data/ data/

      - name: Build
        working-directory: supertux/build
        run: |
          source ~/emsdk/emsdk_env.sh
          set -o pipefail
          emmake make -j"$(nproc)" 2>&1 | tee build.log

      - name: Guard - no undefined symbols
        working-directory: supertux/build
        run: |
          # Upstream links with -sERROR_ON_UNDEFINED_SYMBOLS=0, so a missing symbol is only a
          # link-time warning and the binary aborts at runtime instead. That is precisely how the
          # published nightly ended up unbootable ("Aborted(missing function: IMG_Load_IO)"), so we
          # refuse to hand on a bundle that carries one.
          if grep -Ei "undefined symbol" build.log; then
            echo "::error::Link reported undefined symbols - this bundle would abort at runtime."
            exit 1
          fi
          echo "OK: no undefined symbols reported."

      - name: Collect output
        working-directory: supertux/build
        run: |
          cp template.html supertux2.html
          mkdir -p upload
          mv supertux2* upload/

      - name: Guard - output must be single-threaded
        working-directory: supertux/build/upload
        run: |
          # The whole point of this pipeline. If either check trips, the bundle would need
          # cross-origin isolation and would not run inline on Android.
          if [ -f supertux2.worker.js ]; then
            echo "::error::supertux2.worker.js present - this is a pthreads build."
            exit 1
          fi
          if grep -Eq "SharedArrayBuffer|PThread|pthread_|Atomics\." supertux2.js; then
            echo "::error::supertux2.js references threading primitives - it would require SharedArrayBuffer."
            exit 1
          fi
          echo "OK: single-threaded - runs without SharedArrayBuffer."

      - name: Write build manifest
        working-directory: supertux/build/upload
        run: |
          {
            echo "supertux_ref  = ${SUPERTUX_REF}"
            echo "supertux_sha  = ${{ steps.src.outputs.sha }}"
            echo "emcc          = ${{ steps.em.outputs.emcc }}"
            echo "emsdk_request = ${EMSDK_VERSION}"
            echo "build_type    = ${BUILD_TYPE}"
            echo "built_utc     = $(date -u +%FT%TZ)"
            echo
            echo "sizes:"; ls -l supertux2.*
            echo
            echo "sha256:"; sha256sum supertux2.*
          } | tee build-manifest.txt
          {
            echo '### SuperTux WASM build'
            echo '```'
            cat build-manifest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: supertux-wasm-${{ env.SUPERTUX_REF }}-${{ env.BUILD_TYPE }}
          path: supertux/build/upload/*
          retention-days: 90
          if-no-files-found: error
