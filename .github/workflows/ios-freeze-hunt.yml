# Freeze hunt: drives the real chat screen on the iOS Simulator against the fixture backend's streamed replies
# (ios/TappyAIUITests/ChatFreezeUITests.swift) and prints the app's own diagnostics, which include the main
# thread's call stack when it stalls. Manual only, and a separate workflow on purpose: it never shares the
# concurrency group of ios.yml, so running it cannot cancel (or be cancelled by) a TestFlight run.
name: iOS freeze hunt

on:
  # A manual workflow can only be started from the CLI once it exists on the default branch, and this one lives on the iOS branch: so a push to an
  # ios/** branch runs it when the commit message contains [hunt].
  push:
    branches: ["ios/**"]
  workflow_dispatch:

concurrency:
  group: hunt-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hunt:
    name: Chat freeze hunt (simulator)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[hunt]')
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          mkdir -p build

      - name: Pick iOS Simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in data if "iOS" in k), reverse=True)
          for runtime in ios:
              for d in data[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Start fixture backend
        run: |
          nohup python3 scripts/ui_stub_server.py 3000 > build/stub.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:3000/api/config > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/api/config | head -c 120; echo

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project TappyAI.xcodeproj \
            -scheme TappyAI \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tail -n 5

      # One xcodebuild per SHAPE of reply, so the app's own diagnostics (which a new launch overwrites) are copied after each one.
      - name: Chat freeze UI tests, one shape at a time
        id: test
        continue-on-error: true
        run: |
          failed=0
          for t in testLazyPlain testEagerPlain testLazyArticle testEagerArticle testLazyFull testEagerFull; do
            echo "=================== $t ==================="
            set +e
            xcodebuild test-without-building \
              -project TappyAI.xcodeproj \
              -scheme TappyAI \
              -configuration Debug \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath build/DerivedData \
              -skipPackagePluginValidation \
              -only-testing:TappyAIUITests/ChatFreezeUITests/$t \
              -resultBundlePath build/hunt-$t.xcresult \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" > build/xcodebuild-$t.log 2>&1
            code=$?
            set -e
            grep -E "ChatFreezeUITests.*(error|failed|passed)|Test Case .* (passed|failed)" build/xcodebuild-$t.log | cut -c1-400 || true
            [ $code -eq 0 ] && echo "RESULT $t: PASSED" || { echo "RESULT $t: FAILED"; failed=1; }
            # The app's own record of this run: stream marks, drawing marks and, when the main thread stalled, its call stack.
            container=$(xcrun simctl get_app_container "${{ steps.sim.outputs.udid }}" com.tappyai.ios.debug data 2>/dev/null || true)
            log="$container/Library/Caches/tappy-diagnostics.log"
            if [ -f "$log" ]; then
              cp "$log" build/diag-$t.log
              echo "---- diagnostics of $t ----"
              cat build/diag-$t.log
              {
                echo "### $t"
                echo '```'
                tail -n 120 build/diag-$t.log
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "no diagnostics file for $t"
            fi
          done
          exit $failed

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-freeze-hunt
          path: |
            ios/build/hunt-*.xcresult
            ios/build/diag-*.log
            ios/build/xcodebuild-test*.log
            ios/build/stub.log

      - name: Fail when the freeze reproduced
        if: steps.test.outcome == 'failure'
        run: |
          echo "::error::the chat UI test failed: see the diagnostics above (stall lines and stack) and the uploaded evidence"
          exit 1
