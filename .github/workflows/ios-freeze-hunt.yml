# Freeze hunt: drives the real chat screen on the iOS Simulator against the fixture backend's streamed replies
# (ios/TappyAIUITests/ChatFreezeUITests.swift) and prints the app's own diagnostics, which include the main
# thread's call stack when it stalls. Manual only, and a separate workflow on purpose: it never shares the
# concurrency group of ios.yml, so running it cannot cancel (or be cancelled by) a TestFlight run.
name: iOS freeze hunt

on:
  # A manual workflow can only be started from the CLI once it exists on the default branch, and this one lives on the iOS branch: so a push to an
  # ios/** branch runs it when the commit message contains [hunt].
  push:
    branches: ["ios/**"]
  workflow_dispatch:

concurrency:
  group: hunt-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hunt:
    name: Chat freeze hunt (simulator)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[hunt]')
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          mkdir -p build

      - name: Pick iOS Simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in data if "iOS" in k), reverse=True)
          for runtime in ios:
              for d in data[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Start fixture backend
        run: |
          nohup python3 scripts/ui_stub_server.py 3000 > build/stub.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:3000/api/config > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/api/config | head -c 120; echo

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Chat freeze UI test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          rm -rf build/hunt.xcresult
          xcodebuild test \
            -project TappyAI.xcodeproj \
            -scheme TappyAI \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -only-testing:TappyAIUITests/ChatFreezeUITests \
            -resultBundlePath build/hunt.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild-hunt.log

      # The app's own record of the run: stream marks, drawing marks and, when the main thread stalled, its call stack.
      - name: Print the app's diagnostics
        if: always()
        run: |
          container=$(xcrun simctl get_app_container "${{ steps.sim.outputs.udid }}" com.tappyai.ios.debug data 2>/dev/null || true)
          echo "app data container: ${container:-none}"
          log="$container/Library/Caches/tappy-diagnostics.log"
          if [ -f "$log" ]; then
            cp "$log" build/tappy-diagnostics.log
            echo "### App diagnostics (last session)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 build/tappy-diagnostics.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "---- tappy-diagnostics.log ----"
            cat build/tappy-diagnostics.log
          else
            echo "no diagnostics file at $log"
          fi
          echo "---- stall lines ----"
          grep -n "stalled\|stall stack\|answered again" build/tappy-diagnostics.log 2>/dev/null || echo "none recorded"
          echo "---- crash / hang reports ----"
          ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | head -20 || true
          cp ~/Library/Logs/DiagnosticReports/*TappyAI* build/ 2>/dev/null || true

      - name: Test outcome
        run: |
          echo "ui test outcome: ${{ steps.test.outcome }}"
          grep -E "error:|Test Case .* (passed|failed)|\*\* TEST" build/xcodebuild-hunt.log | tail -20 || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-freeze-hunt
          path: |
            ios/build/hunt.xcresult
            ios/build/tappy-diagnostics.log
            ios/build/xcodebuild-hunt.log
            ios/build/stub.log
            ios/build/*.ips
            ios/build/*.crash

      - name: Fail when the freeze reproduced
        if: steps.test.outcome == 'failure'
        run: |
          echo "::error::the chat UI test failed: see the diagnostics above (stall lines and stack) and the uploaded evidence"
          exit 1
