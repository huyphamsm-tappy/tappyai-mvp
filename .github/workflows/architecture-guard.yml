# Architecture Guard — automated enforcement of docs/architecture/AI_PLATFORM.md
# Fails the build if any AI-architecture rule is violated (vendor SDK imports,
# hardcoded model ids, vendor keys/instantiation/cache logic outside the
# provider layer, or bypassing the AI facade). Same check as local:
#   npm run architecture:check
name: Architecture Guard

on:
  push:
  pull_request:

# Security audit 04/11 (D-01): the token these jobs get is read-only; nothing here writes to the repository.
permissions:
  contents: read

jobs:
  guard:
    name: AI architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # Zero-dependency script — no npm install needed.
      - run: node scripts/architecture/check.mjs

  # Brand-registry validation (docs/architecture/BRAND_ASSETS.md §6):
  # duplicate ids/aliases, missing or empty asset files, invalid paths,
  # unsupported extensions, assetType mismatches, provenance fields.
  # Same check as local: npm run validate:brands
  brands:
    name: Brand registry validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:brands
