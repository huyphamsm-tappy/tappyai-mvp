<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220" role="img" aria-hidden="true">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="bokeh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123A5E"/><stop offset="42%" stop-color="#3E6F86"/>
      <stop offset="72%" stop-color="#C98A5B"/><stop offset="100%" stop-color="#F0BE7E"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D2" stop-opacity="1"/>
      <stop offset="35%" stop-color="#FFC978" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#FF9B4A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0A86E"/><stop offset="30%" stop-color="#6E7E85"/>
      <stop offset="100%" stop-color="#16232F"/>
    </linearGradient>

    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".42"/>
    </radialGradient>
    <clipPath id="frame"><rect width="440" height="220"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">

    <rect width="440" height="220" fill="url(#sky)"/>
    <ellipse cx="300" cy="104" rx="118" ry="80" fill="url(#sun)"/>
    <circle cx="300" cy="106" r="14" fill="#FFF2D2" opacity=".95"/>
    <!-- cloud bands: long, thin, blurred, warm underneath -->
    <g filter="url(#haze)">
      <ellipse cx="146" cy="42" rx="106" ry="7" fill="#E9B98C" opacity=".36"/>
      <ellipse cx="334" cy="60" rx="88"  ry="6" fill="#F4CFA2" opacity=".4"/>
      <ellipse cx="80"  cy="74" rx="72"  ry="5" fill="#EFC79C" opacity=".28"/>
    </g>

    <!-- three depth layers of SEPARATE stacks, sky visible between them -->
    <g fill="#89A3AF" opacity=".4">
      <path d="M25 134 C22 119.72, 26.52 106.8, 38.3 100 C43.05 97, 50.46 101.36, 53.88 105.44 C62.05 114.28, 66 123.8, 63 134 Z"/>
      <path d="M143 134 C140 116.36, 145.0 100.4, 160.5 92 C166.75 89, 176.5 93.68, 181.0 98.72 C191.75 109.64, 196 121.4, 193 134 Z"/>
      <path d="M285 134 C282 124.76, 286.2 116.4, 295.5 112 C299.25 109, 305.1 112.88, 307.8 115.52 C314.25 121.24, 318 127.4, 315 134 Z"/>
      <path d="M374 134 C371 118.04, 375.92 103.6, 390.8 96 C396.8 93, 406.16 97.52000000000001, 410.48 102.08 C420.8 111.96000000000001, 425 122.6, 422 134 Z"/>
    </g>
    <g fill="#3E6272" opacity=".72">
      <path d="M76 134 C73 112.16, 77.92 92.4, 92.8 82 C98.8 79, 108.16 84.08, 112.48 90.32 C122.8 103.84, 127 118.4, 124 134 Z"/>
      <path d="M184 134 C181 107.96000000000001, 186.4 84.4, 205.0 72 C212.5 69, 224.2 74.48, 229.6 81.92 C242.5 98.03999999999999, 247 115.4, 244 134 Z"/>
      <path d="M251 134 C248 120.56, 252.36 108.4, 262.9 102 C267.15 99, 273.78 103.28, 276.84 107.12 C284.15 115.44, 288 124.4, 285 134 Z"/>
      <path d="M322 134 C319 116.36, 323.76 100.4, 337.4 92 C342.9 89, 351.48 93.68, 355.44 98.72 C364.9 109.64, 369 121.4, 366 134 Z"/>
    </g>
    <g fill="#14242E" opacity="1">
      <path d="M-14 134 C-17 102.92, -11.280000000000001 74.8, 9.8 60 C18.3 57, 31.560000000000002 62.96000000000001, 37.68 71.84 C52.3 91.08000000000001, 57 111.8, 54 134 Z"/>
      <path d="M119 134 C116 114.68, 120.68 97.19999999999999, 133.7 88 C138.95 85, 147.14 89.84, 150.92 95.36 C159.95 107.32, 164 120.2, 161 134 Z"/>
      <path d="M350 134 C347 104.6, 352.56 78.0, 372.4 64 C380.4 61, 392.88 66.8, 398.64 75.2 C412.4 93.4, 417 113.0, 414 134 Z"/>
      <path d="M412 134 C409 113.0, 413.76 94.0, 427.4 84 C432.9 81, 441.48 86.0, 445.44 92.0 C454.9 105.0, 459 119.0, 456 134 Z"/>
    </g>

    <rect x="0" y="134" width="440" height="86" fill="url(#sea)"/>
    <!-- only the NEAREST layer reflects: mirrored, faded and blurred. Reflecting every
         layer fills the water with noise and the bay stops reading as water. -->
    <g transform="translate(0 268) scale(1 -1)" opacity=".22" filter="url(#haze)">
    <g fill="#14242E" opacity="1">
      <path d="M-14 134 C-17 102.92, -11.280000000000001 74.8, 9.8 60 C18.3 57, 31.560000000000002 62.96000000000001, 37.68 71.84 C52.3 91.08000000000001, 57 111.8, 54 134 Z"/>
      <path d="M119 134 C116 114.68, 120.68 97.19999999999999, 133.7 88 C138.95 85, 147.14 89.84, 150.92 95.36 C159.95 107.32, 164 120.2, 161 134 Z"/>
      <path d="M350 134 C347 104.6, 352.56 78.0, 372.4 64 C380.4 61, 392.88 66.8, 398.64 75.2 C412.4 93.4, 417 113.0, 414 134 Z"/>
      <path d="M412 134 C409 113.0, 413.76 94.0, 427.4 84 C432.9 81, 441.48 86.0, 445.44 92.0 C454.9 105.0, 459 119.0, 456 134 Z"/>
    </g>
    </g>
    <!-- the sun's path: one soft column, broken by a few ripples rather than stacked bars -->
    <path d="M286 134 q14 44 -8 86 l44 0 q-22 -42 -8 -86 Z" fill="#FFD9A0" opacity=".3" filter="url(#haze)"/>
    <g fill="#FFE3B4" opacity=".6">
      <rect x="292" y="146" width="17" height="2.6" rx="1.3"/>
      <rect x="286" y="160" width="29" height="2.4" rx="1.2" opacity=".8"/>
      <rect x="294" y="172" width="14" height="2.2" rx="1.1" opacity=".7"/>
      <rect x="280" y="188" width="38" height="2"   rx="1"   opacity=".5"/>
      <rect x="290" y="204" width="22" height="1.8" rx=".9"  opacity=".35"/>
    </g>
    <g stroke="#9FB4BE" stroke-width="1.1" opacity=".26">
      <path d="M24 162 h72"/><path d="M120 180 h56"/><path d="M56 198 h64"/>
      <path d="M348 168 h60"/><path d="M372 192 h52"/>
    </g>

    <!-- a junk under sail. Big enough to be seen at 219px, which is what sets the scale of
         everything behind it — without a boat the stacks could be any size at all. -->
    <g transform="translate(150 168)">
      <path d="M-24 0 q24 11 48 0 q-6 11 -24 11 q-18 0 -24 -11 Z" fill="#0B161D"/>
      <path d="M1 -2 L1 -40 L25 -8 Z" fill="#20353F"/>
      <path d="M-3 -2 L-3 -30 L-22 -6 Z" fill="#182A33"/>
      <path d="M1 -40 L1 0" stroke="#0B161D" stroke-width="2"/>
      <g opacity=".3" transform="translate(0 22) scale(1 -1)">
        <path d="M-24 0 q24 11 48 0 q-6 11 -24 11 q-18 0 -24 -11 Z" fill="#0B161D"/>
        <path d="M1 -2 L1 -34 L21 -8 Z" fill="#20353F"/>
      </g>
    </g>

    <!-- foreground headland, bottom-left: darkest and sharpest thing in frame -->
    <path d="M0 196 q34 -26 70 -16 q30 8 38 30 L0 220 Z" fill="#070E13"/>
    <g stroke="#0A1218" stroke-width="1.5" fill="none" opacity=".65">
      <path d="M338 54 q6 -5 12 0"/><path d="M356 46 q5 -4 10 0"/><path d="M322 64 q4 -3 8 0"/>
    </g>

    <rect width="440" height="220" fill="url(#vig)"/>
    <rect width="440" height="220" filter="url(#grain)" opacity=".5"/>
  </g>
</svg>
