# TappyAI Android — Gradle build configuration (tracked).
#
# Build settings ONLY. `android.useAndroidX` / `android.nonTransitiveRClass` are read
# by AGP too early for any mechanism other than a root gradle.properties, so this file
# MUST be tracked for a fresh clone to build.
#
# Project CREDENTIALS (TAPPYAI_SUPABASE_URL / _ANON_KEY / _GOOGLE_WEB_CLIENT_ID /
# _API_BASE_URL_* and the release keystore secrets) are NOT stored here — they are
# machine-local. Supply them via ~/.gradle/gradle.properties (Gradle merges it) or -P
# overrides, so they never enter the repository. build.gradle.kts falls back to safe
# placeholder defaults for debug/staging when they are absent; the release build hard-
# requires the 9 TAPPYAI_* secrets (see app/build.gradle.kts).

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
