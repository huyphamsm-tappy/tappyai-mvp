<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Cảnh báo tội phạm - Cổng thông tin điện tử Bộ Công an</title></head><body>
<h3 class="category-title text-bca-main-01 font-bold text-lg lg:text-xl uppercase pb-[17px] border-b-[1px] border-b-solid border-b-bca-gray-200" data-v-b989f2a3>Cảnh báo tội phạm</h3><div class="grid grid-cols-1 gap-4 mt-6 lg:gap-6" data-v-b989f2a3><!--[-->
<article class="card-large h-full bg-white border-b border-b-bca-gray-100 lg:border-none lg:pb-0 pb-4 lg:shadow-custom lg:rounded-[8px]" data-v-b989f2a3><figure class="h-full flex space-x-4 lg:space-x-6 lg:p-4"><a href="/bai-viet/khoi-to-doi-tuong-mua-ban-27-tai-khoan-ngan-hang-de-thu-loi-bat-chinh-1794803009" class=""></a><figcaption class="card-content flex-1 h-full flex flex-col space-y-[13px] rounded-r-[8px]"><a href="/bai-viet/khoi-to-doi-tuong-mua-ban-27-tai-khoan-ngan-hang-de-thu-loi-bat-chinh-1794803009" class=""><h2 class="text-[15px] lg:text-lg lg:font-bold text-black hover:text-bca-main-01">Khởi tố đối tượng mua bán 27 tài khoản ngân hàng để thu lợi bất chính</h2></a><p class="hidden lg:block text-[15px] text-bca-gray-700 lg:!line-clamp-3">Ngày 16/11/2026, Công an tỉnh Hà Tĩnh cho biết, Văn phòng Cơ quan Cảnh sát điều tra Công an tỉnh vừa ra quyết định khởi tố vụ án, khởi tố bị can đối với Mai Thanh Tùng (sinh năm 1997, trú xã Giao Bình, tỉnh Ninh Bình) về tội &quot;Thu thập, tàng trữ, trao đổi, mua bán, công khai hóa trái phép thông tin về tài khoản ngân hàng&quot;, quy định tại Khoản 1, Điều 291, Bộ luật Hình sự. Đồng thời áp dụng biện pháp ngăn chặn cấm đi khỏi nơi cư trú và tạm hoãn xuất cảnh đối với bị can.</p><span class="hidden lg:block text-bca-gray-700 text-xs">16/11/2026</span></figcaption></figure></article>
<article class="card-large h-full bg-white border-b border-b-bca-gray-100 lg:border-none lg:pb-0 pb-4 lg:shadow-custom lg:rounded-[8px]" data-v-b989f2a3><figure class="h-full flex space-x-4 lg:space-x-6 lg:p-4"><a href="/bai-viet/canh-bao-hanh-vi-mua-ban-su-dung-trai-phep-trang-phuc-cong-an-nhan-dan-de-song-ao-cau-like-tren-mang-xa-hoi-1794557846" class=""></a><figcaption class="card-content flex-1 h-full flex flex-col space-y-[13px] rounded-r-[8px]"><a href="/bai-viet/canh-bao-hanh-vi-mua-ban-su-dung-trai-phep-trang-phuc-cong-an-nhan-dan-de-song-ao-cau-like-tren-mang-xa-hoi-1794557846" class=""><h2 class="text-[15px] lg:text-lg lg:font-bold text-black hover:text-bca-main-01">Cảnh báo hành vi mua bán, sử dụng trái phép trang phục Công an nhân dân để &quot;sống ảo&quot;, câu like trên mạng xã hội.</h2></a><p class="hidden lg:block text-[15px] text-bca-gray-700 lg:!line-clamp-3">Thời gian gần đây, xuất hiện tình trạng một số cá nhân tự ý mua trang phục, quân hiệu, phù hiệu Công an nhân dân (CAND) hoặc dùng công nghệ AI ghép mặt, chỉnh sửa video/hình ảnh đăng lên TikTok, Facebook để tăng tương tác. Vừa qua, Phòng An ninh mạng - Công an TP. Hải Phòng đã xử phạt vi phạm hành chính anh P.C.T (sinh năm  2004, trú tại P. Bắc An Phụ, TP. Hải Phòng) về hành vi này. </p><span class="hidden lg:block text-bca-gray-700 text-xs">13/11/2026</span></figcaption></figure></article>
<article class="card-large h-full bg-white border-b border-b-bca-gray-100 lg:border-none lg:pb-0 pb-4 lg:shadow-custom lg:rounded-[8px]" data-v-b989f2a3><figure class="h-full flex space-x-4 lg:space-x-6 lg:p-4"><a href="/bai-viet/ca-mau-kham-pha-nhanh-vu-trom-cap-tai-san-tri-gia-khoang-5-ty-dong-1794561699" class=""></a><figcaption class="card-content flex-1 h-full flex flex-col space-y-[13px] rounded-r-[8px]"><a href="/bai-viet/ca-mau-kham-pha-nhanh-vu-trom-cap-tai-san-tri-gia-khoang-5-ty-dong-1794561699" class=""><h2 class="text-[15px] lg:text-lg lg:font-bold text-black hover:text-bca-main-01">Cà Mau: Khám phá nhanh vụ trộm cắp tài sản trị giá khoảng 05 tỷ đồng</h2></a><p class="hidden lg:block text-[15px] text-bca-gray-700 lg:!line-clamp-3">Ngày 13/11/2026, Công an tỉnh Cà Mau cho biết, Cơ quan Cảnh sát điều tra Công an tỉnh vừa thi hành Lệnh giữ người trong trường hợp khẩn cấp và Lệnh khám xét khẩn cấp đối với 04 đối tượng liên quan đến vụ án trộm cắp tài sản xảy ra ngày 04/11/2026 tại khóm Bùng Binh, phường Hòa Thành, tỉnh Cà Mau. Tổng giá trị tài sản bị chiếm đoạt ước tính khoảng 05 tỷ đồng.</p><span class="hidden lg:block text-bca-gray-700 text-xs">13/11/2026</span></figcaption></figure></article>
<article class="card-large h-full bg-white border-b border-b-bca-gray-100 lg:border-none lg:pb-0 pb-4 lg:shadow-custom lg:rounded-[8px]" data-v-b989f2a3><figure class="h-full flex space-x-4 lg:space-x-6 lg:p-4"><a href="/bai-viet/kip-thoi-ngan-chan-lua-dao-qua-mang-bao-ve-tai-san-cho-nguoi-dan-1794452599" class=""></a><figcaption class="card-content flex-1 h-full flex flex-col space-y-[13px] rounded-r-[8px]"><a href="/bai-viet/kip-thoi-ngan-chan-lua-dao-qua-mang-bao-ve-tai-san-cho-nguoi-dan-1794452599" class=""><h2 class="text-[15px] lg:text-lg lg:font-bold text-black hover:text-bca-main-01">Kịp thời ngăn chặn lừa đảo qua mạng, bảo vệ tài sản cho người dân</h2></a><p class="hidden lg:block text-[15px] text-bca-gray-700 lg:!line-clamp-3">Ngày 11/11/2026, Công an xã Đồng Hỷ, tỉnh Thái Nguyên đã kịp thời phát hiện, ngăn chặn 01 vụ lừa đảo chiếm đoạt tài sản qua không gian mạng, giúp người dân tránh mất số tiền tiết kiệm hơn 200 triệu đồng.</p><span class="hidden lg:block text-bca-gray-700 text-xs">11/11/2026</span></figcaption></figure></article>
<article class="card-large h-full bg-white border-b border-b-bca-gray-100 lg:border-none lg:pb-0 pb-4 lg:shadow-custom lg:rounded-[8px]" data-v-b989f2a3><figure class="h-full flex space-x-4 lg:space-x-6 lg:p-4"><a href="/bai-viet/cao-bang-cong-an-phuong-ngan-chan-03-vu-lua-dao-bao-ve-285-trieu-dong-cho-nguoi-dan-1794279392" class=""></a><figcaption class="card-content flex-1 h-full flex flex-col space-y-[13px] rounded-r-[8px]"><a href="/bai-viet/cao-bang-cong-an-phuong-ngan-chan-03-vu-lua-dao-bao-ve-285-trieu-dong-cho-nguoi-dan-1794279392" class=""><h2 class="text-[15px] lg:text-lg lg:font-bold text-black hover:text-bca-main-01">Cao Bằng: Công an phường ngăn chặn 03 vụ lừa đảo, bảo vệ 285 triệu đồng cho người dân</h2></a><p class="hidden lg:block text-[15px] text-bca-gray-700 lg:!line-clamp-3">Ngày 09/11/2026, từ thông tin do Bưu điện phường Thục Phán, tỉnh Cao Bằng cung cấp về 03 trường hợp người cao tuổi có biểu hiện bất thường khi thực hiện giao dịch tài chính, Công an phường Thục Phán đã kịp thời xác minh, ngăn chặn nguy cơ lừa đảo với tổng số tiền lên tới 285 triệu đồng.</p><span class="hidden lg:block text-bca-gray-700 text-xs">10/11/2026</span></figcaption></figure></article>
<article class="card-large h-full bg-white border-b border-b-bca-gray-100 lg:border-none lg:pb-0 pb-4 lg:shadow-custom lg:rounded-[8px]" data-v-b989f2a3><figure class="h-full flex space-x-4 lg:space-x-6 lg:p-4"><a href="/bai-viet/catp-hai-phong-canh-giac-voi-thu-doan-su-dung-trai-phep-thong-tin-ca-nhan-de-dang-ky-thanh-lap-doanh-nghiep-1794280907" class=""></a><figcaption class="card-content flex-1 h-full flex flex-col space-y-[13px] rounded-r-[8px]"><a href="/bai-viet/catp-hai-phong-canh-giac-voi-thu-doan-su-dung-trai-phep-thong-tin-ca-nhan-de-dang-ky-thanh-lap-doanh-nghiep-1794280907" class=""><h2 class="text-[15px] lg:text-lg lg:font-bold text-black hover:text-bca-main-01">CATP Hải Phòng: Cảnh giác với thủ đoạn sử dụng trái phép thông tin cá nhân để đăng ký thành lập doanh nghiệp</h2></a><p class="hidden lg:block text-[15px] text-bca-gray-700 lg:!line-clamp-3">Việc lợi dụng thông tin và dữ liệu cá nhân để đăng ký thành lập doanh nghiệp khi chưa được sự đồng ý của chủ thể hiện tiềm ẩn nhiều nguy cơ ảnh hưởng trực tiếp đến quyền, lợi ích hợp pháp của công dân, gây khó khăn cho công tác quản lý nhà nước và có thể bị lợi dụng để thực hiện các hành vi vi phạm pháp luật. Trước tình hình trên, Phòng Cảnh sát kinh tế - Công an thành phố Hải Phòng khuyến cáo người dân nâng cao tinh thần cảnh giác, chủ động bảo vệ thông tin cá nhân và kịp thời phát hiện, phản ánh các trường hợp có dấu hiệu bị mạo danh.</p><span class="hidden lg:block text-bca-gray-700 text-xs">10/11/2026</span></figcaption></figure></article>
</div></body></html>
